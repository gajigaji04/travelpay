spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DB_URL}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    hikari:
      # 트랜잭션 타임아웃은 커넥션을 얻은 뒤부터 적용되므로 획득 대기도 따로 제한
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        # DB 응답을 기다리는 각 소켓 읽기의 상한(초). 멈춘 DB에서는 SQL 취소도 처리되지 않으므로 연결을 끊고 풀이 버림
        # 비밀번호 변경·관리자의 JDBC 실행 기한(기본 5초)보다 길어야 함. 이 기한을 7초 이상으로 바꾸면 시작 검사가 앱 시작을 거부
        # URL의 socketTimeout·cancelSignalTimeout·options는 이 설정을 덮어쓰므로 시작 검사가 거부. SSL·currentSchema 등은 허용
        socketTimeout: 7
        # 별도 연결로 보내는 SQL 취소의 연결·읽기 대기 상한(초, Driver 기본 10). 문장 정리는 진행 중인 자기 취소가 끝나기를 기다릴 수 있음
        # 소켓 읽기 상한에 취소 정리 대기가 더해질 수 있으며, 이 둘은 전체 HTTP 요청의 하드 기한을 보장하지 않음
        # 기본 10초면 멈춘 DB에서 응답이 약 11초로 늘어 Gateway의 User 라우트 제한(10초)을 넘는 것을 시험으로 확인해 1초로 둠
        cancelSignalTimeout: 1
        # 앱 풀의 개별 잠금 획득 대기는 DB가 2초에 중단(55P03 → 503, 응답 가능한 DB에서는 연결 유지).
        # 비밀번호 변경·관리자의 JDBC 실행 기한(5초)과 동시에 적용. 전체 트랜잭션·HTTP 요청의 2초 상한은 아니며 정상 경합도 거부될 수 있음
        # 읽기 트랜잭션의 남은 시간이 0.5초 미만이면 Hibernate가 질의 제한을 0(없음)으로 바꾸므로 이 잠금 상한이 필요
        # 연결 시작 옵션으로 적용. Flyway는 별도 연결이라 적용되지 않음
        options: "-c lock_timeout=2s"
  flyway:
    # 테이블과 초기 약관은 db/migration의 Flyway 파일이 만듭니다.
    default-schema: user_service
    # 계정을 지정하면 마이그레이션은 앱 연결 풀이 아닌 별도 연결을 써서, 위 소켓 읽기 상한에 걸리지 않음(오래 걸리는 변경 보호)
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  jpa:
    open-in-view: false
    hibernate:
      # Hibernate는 테이블을 만들거나 바꾸지 않고, 엔티티와 맞는지 검사만 합니다.
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_SESSION_HOST:redis-session}
      port: ${REDIS_SESSION_PORT:6379}
      password: ${REDIS_SESSION_PASSWORD}
      # 각 Redis 연결·명령의 대기 상한입니다. 전체 HTTP 요청 시간 제한과는 다릅니다.
      connect-timeout: 2s
      timeout: 2s
      repositories:
        enabled: false
  session:
    # 마지막 세션 접근 후 60분간 사용하지 않으면 만료됩니다.
    timeout: 60m
    data:
      redis:
        namespace: travelpay:user:session

travelpay:
  auth:
    header-context:
      # User에서는 회원 헤더로 요청자 정보를 만들지 않습니다.
      enabled: false
  user:
    session:
      # 로그인 시각부터 24시간이 지나면 사용 중이어도 다시 로그인해야 합니다.
      absolute-timeout: 24h
    password-change:
      # 해시 연산을 제외한 DB 트랜잭션의 JDBC 실행 기한. 개별 잠금 획득에는 앱 풀 lock_timeout(2초)도 동시에 적용
      # 연결 획득·해시 연산 등을 포함한 전체 HTTP 요청을 5초에 강제 종료하는 보장은 아님
      transaction-timeout: ${USER_PASSWORD_CHANGE_TRANSACTION_TIMEOUT:5s}
    admin:
      # 관리자 API(회원 정지·해제·세션 종료·검색, 약관 등록·조회)의 DB 트랜잭션에서 JDBC에 전달할 실행 기한
      # 개별 잠금 획득에는 앱 풀 lock_timeout(2초)도 동시에 적용. 연결 획득 등을 포함한 전체 HTTP 요청의 하드 기한은 아님
      transaction-timeout: ${USER_ADMIN_TRANSACTION_TIMEOUT:5s}
    login-attempt:
      # 같은 이메일+IP로 window 안에 pair-limit번 실패하면 block 동안 로그인을 막습니다.
      pair-limit: 5
      # 같은 이메일로 IP와 관계없이 window 안에 account-limit번 실패하면 block 동안 로그인을 막습니다.
      account-limit: 20
      window: 10m
      block: 20m
    recipient-lookup:
      # 수취인 조회 제한의 요청자별 허용 횟수와 집계 기간입니다.
      limit: ${USER_RECIPIENT_LOOKUP_LIMIT:60}
      period: ${USER_RECIPIENT_LOOKUP_PERIOD:60s}
    transfer-notification:
      # payment.transfer.completed 소비자(송금 완료 → Slack 알림). 끄면 이벤트는 토픽에 남고 켤 때 이어서 읽습니다.
      # 운영 Kafka 설정(KAFKA_BOOTSTRAP_SERVERS)을 인프라와 정하기 전까지 소비자를 시작하지 않습니다(payment 발행기도 운영에서 꺼져 있음).
      consumer-enabled: false
      concurrency: 1
      # Slack Incoming Webhook 주소(비밀값, 환경 변수로만). 비어 있으면 수신 기록만 하고 보내지 않습니다.
      slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    notification-retention:
      # 보관 기간이 지난 화면 알림(읽은 것만)과 송금 완료 수신 기록을 주기적으로 지웁니다.
      enabled: true
      # 읽은 화면 알림은 발생 시각부터 90일. 읽지 않은 알림은 기간이 지나도 남깁니다.
      read-notification-retention: 90d
      # 수신 기록(Slack 중복 거르기)은 받은 시각부터 30일. 토픽 보관 기간(Kafka 기본 7일)보다 길어야 합니다(7일 미만 거부).
      transfer-event-retention: 30d
      # 한 트랜잭션에서 지울 최대 행 수. 한 주기에 테이블마다 최대 100번까지 반복합니다.
      batch-size: 1000
      initial-delay: 5m
      fixed-delay: 1h

server:
  port: 8080
  # Gateway의 8KiB 수신 한도에 내부 헤더가 추가될 여유를 둡니다.
  max-http-request-header-size: 16KB
  # Gateway가 보낸 Client-Ip(실제 클라이언트 IP)를 클라이언트 주소로 씀. 내부 대역에서 온 요청만 해당
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: Client-Ip
  servlet:
    session:
      cookie:
        name: SESSION
        path: /
        http-only: true
        same-site: lax
        secure: true

# 운영에서는 API 문서를 노출하지 않습니다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

eureka:
  instance:
    hostname: user-service
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
